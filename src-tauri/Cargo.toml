[package]
name = "sanctum-desktop"
version = "1.0.0"
description = "Sanctum Sovereign Local AI Desktop Application (Embedded WebView2)"
authors = ["Sanctum Contributors"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.33"
windows = { version = "0.58", features = ["Win32_System_JobObjects", "Win32_UI_Shell"] }
