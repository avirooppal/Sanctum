name: Sanctum Verification and Release Build
on: [push, pull_request]

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: npm ci

      - name: Check Layer Architecture
        run: npm run check-arch

      - name: Run Test Suite
        run: npm test

      - name: Build Next.js Web Frontend
        run: npm run build

  windows-build:
    needs: source-gates
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: npm ci

      - name: Build Standalone Sanctum.exe
        run: python tools/build_installer.py

      - name: Package Distribution Checksums
        run: python tools/package_distribution.py

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sanctum-Desktop-x64
          path: |
            Sanctum.exe
            SHA256SUMS
            sbom.spdx.json
            LICENSE_BUNDLE.txt
            THIRD_PARTY_NOTICES.txt
