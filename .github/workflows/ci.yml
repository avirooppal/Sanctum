name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-gates:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.12.14"
      - run: uv sync --locked --group knowledge --python 3.12
      - run: uv run --offline --group knowledge python tools/check.py
      - if: runner.os == 'Linux'
        run: python3 tools/isolated_run.py -- python3 -c "print('isolated child started')"
  rust-foundation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned development toolchain and fetch locked crates
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
      - name: Offline Rust checks and real kernel containment test
        run: bash tools/check_rust.sh
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci --prefix apps/web
      - run: npm audit --prefix apps/web --audit-level=low
      - run: npm run typecheck --prefix apps/web
      - run: npm test --prefix apps/web
      - run: npm run build --prefix apps/web
