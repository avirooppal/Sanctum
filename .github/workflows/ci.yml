name: foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: "0.12.14"
      - run: uv sync --locked --group knowledge --python 3.12 --managed-python
      - run: uv run --offline --group knowledge python tools/check.py
      - if: runner.os == 'Linux'
        run: python3 tools/isolated_run.py -- python3 -c "print('isolated child started')"
  rust-foundation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned development toolchain and fetch locked crates
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          cargo fetch --locked
      - name: Offline Rust checks and real kernel containment test
        run: bash tools/check_rust.sh
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm ci --prefix apps/web
      - run: npm audit --prefix apps/web --audit-level=low
      - run: npm run typecheck --prefix apps/web
      - run: npm test --prefix apps/web
      - run: npm run build --prefix apps/web
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: pip install pillow
      - name: Install Web dependencies and build
        run: |
          npm ci --prefix apps/web
          npm run build --prefix apps/web
      - name: Build Windows Installer (.EXE)
        run: python tools/build_installer.py
      - name: Verify Installed Exe and Cleanup
        run: python tools/verify_installed_exe.py
      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sanctum-Windows-x64-Setup
          path: dist/*

