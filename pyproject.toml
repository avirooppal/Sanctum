[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctum-local"
version = "0.1.0"
description = "Offline diagnostics for the Sanctum private AI platform"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sanctum = "sanctum.cli:main"

[tool.setuptools.packages.find]
where = ["apps/cli"]
include = ["sanctum*"]

[dependency-groups]
dev = [
    "ruff==0.14.0",
    "jsonschema==4.25.1",
    "setuptools==80.9.0",
    "ty==0.0.85",
    "rpds-py==0.30.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
