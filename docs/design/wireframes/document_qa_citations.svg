<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" style="background:#0f1412; font-family:sans-serif;">
  <!-- Sidebar -->
  <rect x="0" y="0" width="237" height="600" fill="#121815" stroke="#283832" stroke-width="1"/>
  <text x="20" y="35" fill="#e8efe9" font-size="16" font-weight="bold">Sanctum</text>
  <rect x="180" y="20" width="36" height="24" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="189" y="36" fill="#9fb3a4" font-size="11">+N</text>
  <rect x="15" y="60" width="207" height="30" rx="4" fill="#151c19" stroke="#283832"/>
  <text x="28" y="80" fill="#758b7b" font-size="12">Search conversations...</text>
  <!-- Active Session -->
  <rect x="10" y="105" width="217" height="36" rx="4" fill="#1c2622" stroke="#48a87b" stroke-width="1"/>
  <text x="24" y="128" fill="#e8efe9" font-size="12" font-weight="bold">Phase 3 Trial Findings</text>
  <rect x="10" y="145" width="217" height="36" rx="4" fill="none"/>
  <text x="24" y="168" fill="#9fb3a4" font-size="12">Local RAG Architecture</text>

  <!-- Center Chat Area -->
  <rect x="237" y="0" width="443" height="600" fill="#0f1412"/>
  <!-- Top Bar -->
  <line x1="237" y1="50" x2="680" y2="50" stroke="#283832"/>
  <text x="260" y="32" fill="#e8efe9" font-size="14" font-weight="bold">Phase 3 Trial Findings</text>
  <rect x="440" y="18" width="140" height="22" rx="11" fill="#1c2622"/>
  <text x="455" y="33" fill="#48a87b" font-size="11">Qwen 2.5 7B Q4_K_M</text>

  <!-- Messages -->
  <!-- User Message -->
  <rect x="360" y="70" width="300" height="60" rx="6" fill="#23583f"/>
  <text x="375" y="95" fill="#ffffff" font-size="13">What were the adverse event rates</text>
  <text x="375" y="115" fill="#ffffff" font-size="13">reported in cohort B?</text>

  <!-- Assistant Message -->
  <rect x="255" y="145" width="405" height="175" rx="6" fill="#151c19" stroke="#283832"/>
  <text x="270" y="170" fill="#9fb3a4" font-size="11">Sanctum Assistant • 24.5 tok/s</text>
  <text x="270" y="195" fill="#e8efe9" font-size="13">In cohort B, the reported mild adverse event rate</text>
  <text x="270" y="215" fill="#e8efe9" font-size="13">was 4.2%, primarily consisting of transient headaches.</text>
  <!-- Citation Chip -->
  <rect x="270" y="230" width="180" height="24" rx="4" fill="#1c2622" stroke="#48a87b" stroke-width="1.5"/>
  <text x="282" y="246" fill="#48a87b" font-size="11" font-weight="bold">[Doc 1: trial_report.pdf #p14]</text>
  <text x="270" y="280" fill="#e8efe9" font-size="13">No severe Grade 3/4 events were observed.</text>

  <!-- Composer Dock -->
  <rect x="255" y="520" width="405" height="60" rx="6" fill="#151c19" stroke="#283832"/>
  <text x="275" y="555" fill="#758b7b" font-size="13">Ask a question or type '/' for commands...</text>
  <rect x="615" y="535" width="32" height="30" rx="4" fill="#48a87b"/>
  <text x="626" y="555" fill="#0f1412" font-size="14" font-weight="bold">↑</text>

  <!-- Right Drawer: Citation Inspector -->
  <rect x="680" y="0" width="280" height="600" fill="#121815" stroke="#283832" stroke-width="1"/>
  <text x="700" y="35" fill="#e8efe9" font-size="14" font-weight="bold">Citation Inspector</text>
  <line x1="680" y1="50" x2="960" y2="50" stroke="#283832"/>
  <rect x="700" y="70" width="240" height="120" rx="6" fill="#1c2622" stroke="#283832"/>
  <text x="715" y="95" fill="#48a87b" font-size="12" font-weight="bold">trial_report.pdf (Chunk 14)</text>
  <text x="715" y="115" fill="#9fb3a4" font-size="11">Cosine Similarity: 0.892</text>
  <text x="715" y="140" fill="#e8efe9" font-size="11">"...mild adverse events in Cohort B</text>
  <text x="715" y="158" fill="#e8efe9" font-size="11">occurred in 4.2% (n=12) of patients..."</text>
  <rect x="700" y="210" width="240" height="32" rx="4" fill="#151c19" stroke="#283832"/>
  <text x="750" y="231" fill="#e8efe9" font-size="12">Open Source File</text>
</svg>
