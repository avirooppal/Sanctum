<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" style="background:#0f1412; font-family:sans-serif;">
  <rect width="960" height="600" fill="#0f1412"/>
  
  <!-- Sidebar with session removed -->
  <rect x="0" y="0" width="237" height="600" fill="#121815" stroke="#283832"/>
  <text x="20" y="35" fill="#e8efe9" font-size="16" font-weight="bold">Sanctum</text>
  <rect x="15" y="60" width="207" height="30" rx="4" fill="#151c19" stroke="#283832"/>
  <text x="28" y="80" fill="#758b7b" font-size="12">Search conversations...</text>
  
  <!-- Remaining sessions -->
  <rect x="10" y="105" width="217" height="36" rx="4" fill="#1c2622"/>
  <text x="24" y="128" fill="#e8efe9" font-size="12">Local RAG Architecture</text>
  <rect x="10" y="145" width="217" height="36" rx="4" fill="none"/>
  <text x="24" y="168" fill="#9fb3a4" font-size="12">Weekly Clinical Meeting</text>

  <!-- Main empty / next chat state -->
  <rect x="237" y="0" width="723" height="600" fill="#0f1412"/>
  <text x="600" y="280" fill="#758b7b" font-size="16" text-anchor="middle">Select a conversation or start a new chat (Ctrl+N)</text>

  <!-- Non-blocking Undo Toast (Bottom Right) -->
  <rect x="520" y="500" width="410" height="65" rx="8" fill="#1c2622" stroke="#48a87b" stroke-width="1.5" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.6))"/>
  
  <text x="545" y="530" fill="#e8efe9" font-size="13">Deleted "Phase 3 Protocol Review"</text>
  <text x="545" y="548" fill="#9fb3a4" font-size="11">Item will be permanently removed in 5s</text>
  
  <!-- Undo button -->
  <rect x="765" y="515" width="75" height="32" rx="4" fill="#48a87b"/>
  <text x="785" y="536" fill="#0f1412" font-size="12" font-weight="bold">Undo</text>
  
  <!-- Dismiss button -->
  <rect x="850" y="515" width="60" height="32" rx="4" fill="#151c19" stroke="#283832"/>
  <text x="862" y="536" fill="#9fb3a4" font-size="12">Dismiss</text>

  <!-- 5-second countdown indicator bar -->
  <rect x="520" y="560" width="410" height="4" rx="2" fill="#283832"/>
  <rect x="520" y="560" width="280" height="4" rx="2" fill="#34d399"/>
</svg>
