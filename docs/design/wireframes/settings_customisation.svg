<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" style="background:#0f1412; font-family:sans-serif;">
  <rect width="960" height="600" fill="#0f1412"/>
  
  <!-- Settings Modal Container -->
  <rect x="80" y="40" width="800" height="520" rx="10" fill="#151c19" stroke="#283832" stroke-width="1.5"/>
  
  <!-- Left Settings Navigation -->
  <rect x="80" y="40" width="220" height="520" rx="10" fill="#121815" stroke="#283832"/>
  <text x="110" y="80" fill="#e8efe9" font-size="18" font-weight="bold">Preferences</text>
  
  <rect x="95" y="105" width="190" height="36" rx="6" fill="#1c2622" stroke="#48a87b" stroke-width="1.5"/>
  <text x="115" y="128" fill="#48a87b" font-size="13" font-weight="bold">Appearance &amp; Theme</text>
  
  <rect x="95" y="150" width="190" height="36" rx="6" fill="none"/>
  <text x="115" y="173" fill="#9fb3a4" font-size="13">Workspace Layouts</text>
  
  <rect x="95" y="195" width="190" height="36" rx="6" fill="none"/>
  <text x="115" y="218" fill="#9fb3a4" font-size="13">Keyboard Shortcuts</text>
  
  <rect x="95" y="240" width="190" height="36" rx="6" fill="none"/>
  <text x="115" y="263" fill="#9fb3a4" font-size="13">Privacy &amp; Egress Proof</text>

  <!-- Right Settings Content (Appearance) -->
  <text x="330" y="80" fill="#e8efe9" font-size="18" font-weight="bold">Appearance &amp; Customisation</text>
  <line x1="330" y1="95" x2="850" y2="95" stroke="#283832"/>

  <!-- Theme Preset Selector -->
  <text x="330" y="125" fill="#e8efe9" font-size="13" font-weight="bold">Theme Preset</text>
  <!-- Theme Chips -->
  <rect x="330" y="140" width="90" height="32" rx="4" fill="#1c2622" stroke="#48a87b" stroke-width="1.5"/>
  <text x="345" y="161" fill="#48a87b" font-size="12">Sanctum</text>
  <rect x="430" y="140" width="80" height="32" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="445" y="161" fill="#9fb3a4" font-size="12">GitHub</text>
  <rect x="520" y="140" width="90" height="32" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="532" y="161" fill="#9fb3a4" font-size="12">Catppuccin</text>
  <rect x="620" y="140" width="90" height="32" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="635" y="161" fill="#9fb3a4" font-size="12">Solarized</text>

  <!-- Accent Color Picker with Contrast Guard -->
  <text x="330" y="205" fill="#e8efe9" font-size="13" font-weight="bold">Accent Color &amp; WCAG AA Contrast Guard</text>
  <circle cx="345" cy="235" r="14" fill="#48a87b" stroke="#e8efe9" stroke-width="2"/>
  <circle cx="385" cy="235" r="14" fill="#3b82f6"/>
  <circle cx="425" cy="235" r="14" fill="#ec4899"/>
  <circle cx="465" cy="235" r="14" fill="#eab308"/>
  <!-- Guard Badge -->
  <rect x="510" y="222" width="280" height="26" rx="4" fill="#1c2622" stroke="#34d399"/>
  <text x="525" y="239" fill="#34d399" font-size="11" font-weight="bold">✓ Contrast 5.4:1 on background (WCAG AA Pass)</text>

  <!-- Interface Density -->
  <text x="330" y="285" fill="#e8efe9" font-size="13" font-weight="bold">Interface Density</text>
  <rect x="330" y="300" width="120" height="32" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="350" y="321" fill="#9fb3a4" font-size="12">Compact (85%)</text>
  <rect x="460" y="300" width="140" height="32" rx="4" fill="#1c2622" stroke="#48a87b" stroke-width="1.5"/>
  <text x="475" y="321" fill="#48a87b" font-size="12" font-weight="bold">Comfortable (100%)</text>
  <rect x="610" y="300" width="130" height="32" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="630" y="321" fill="#9fb3a4" font-size="12">Spacious (115%)</text>

  <!-- Bundled OFL Font -->
  <text x="330" y="365" fill="#e8efe9" font-size="13" font-weight="bold">Typography (License-Verified OFL)</text>
  <rect x="330" y="380" width="220" height="32" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="345" y="401" fill="#e8efe9" font-size="12">Archivo (Clean Modern Sans)</text>

  <!-- Import / Export Actions -->
  <line x1="330" y1="440" x2="850" y2="440" stroke="#283832"/>
  <rect x="330" y="465" width="130" height="32" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="345" y="486" fill="#e8efe9" font-size="12">Export JSON</text>
  <rect x="470" y="465" width="130" height="32" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="485" y="486" fill="#e8efe9" font-size="12">Import Theme</text>
  <rect x="740" y="465" width="110" height="32" rx="4" fill="#48a87b"/>
  <text x="765" y="486" fill="#0f1412" font-size="12" font-weight="bold">Done (Esc)</text>
</svg>
