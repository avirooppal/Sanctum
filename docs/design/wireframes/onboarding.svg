<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" style="background:#0f1412; font-family:sans-serif;">
  <rect width="960" height="600" fill="#0f1412"/>
  <rect x="40" y="30" width="880" height="540" rx="8" fill="#151c19" stroke="#283832" stroke-width="1.5"/>
  
  <!-- Header -->
  <text x="80" y="80" fill="#e8efe9" font-size="22" font-weight="bold">Welcome to Sanctum</text>
  <text x="80" y="105" fill="#9fb3a4" font-size="14">Private, on-device intelligence. Zero foreign egress verified.</text>

  <!-- Step 1: Hardware -->
  <rect x="80" y="140" width="380" height="150" rx="6" fill="#1c2622" stroke="#283832"/>
  <text x="100" y="170" fill="#48a87b" font-size="14" font-weight="bold">1. Hardware &amp; Profile</text>
  <text x="100" y="200" fill="#e8efe9" font-size="13">Detected: 8-core CPU • 16 GB RAM • RTX 4070</text>
  <text x="100" y="225" fill="#9fb3a4" font-size="12">Recommended Profile: GPU-Accelerated Balanced</text>
  <rect x="100" y="245" width="120" height="28" rx="4" fill="#23583f"/>
  <text x="125" y="264" fill="#ffffff" font-size="12" font-weight="bold">Confirm Profile</text>

  <!-- Step 2: Model Provisioning -->
  <rect x="500" y="140" width="380" height="150" rx="6" fill="#1c2622" stroke="#283832"/>
  <text x="520" y="170" fill="#48a87b" font-size="14" font-weight="bold">2. Model Provisioning</text>
  <text x="520" y="200" fill="#e8efe9" font-size="13">Selected: Qwen 2.5 7B Q4_K_M (4.8 GB)</text>
  <rect x="520" y="220" width="340" height="8" rx="4" fill="#283832"/>
  <rect x="520" y="220" width="240" height="8" rx="4" fill="#34d399"/>
  <text x="520" y="250" fill="#9fb3a4" font-size="12">Downloading: 70% (3.4 GB / 4.8 GB) • 1m 12s left</text>
  <rect x="780" y="245" width="80" height="26" rx="4" fill="#151c19" stroke="#283832"/>
  <text x="800" y="262" fill="#e8efe9" font-size="11">Cancel</text>

  <!-- Step 3: Zero-Egress Self-Test -->
  <rect x="80" y="310" width="800" height="90" rx="6" fill="#1c2622" stroke="#283832"/>
  <text x="100" y="340" fill="#48a87b" font-size="14" font-weight="bold">3. Privacy Invariant Verification</text>
  <circle cx="110" cy="365" r="5" fill="#34d399"/>
  <text x="125" y="370" fill="#34d399" font-size="13" font-weight="bold">PASS</text>
  <text x="175" y="370" fill="#e8efe9" font-size="13">Egress check: 0 foreign outbound connections • Bound to 127.0.0.1 • Air-gapped ready</text>

  <!-- Step 4: Starter Prompts -->
  <text x="80" y="435" fill="#e8efe9" font-size="14" font-weight="bold">4. Quick Start Prompts</text>
  <rect x="80" y="450" width="250" height="40" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="95" y="475" fill="#9fb3a4" font-size="12">"Summarize local clinical guidelines"</text>
  <rect x="350" y="450" width="250" height="40" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="365" y="475" fill="#9fb3a4" font-size="12">"Explain how on-device RAG works"</text>
  <rect x="620" y="450" width="260" height="40" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="635" y="475" fill="#9fb3a4" font-size="12">"Attach folder to index documents"</text>

  <!-- Actions -->
  <rect x="740" y="515" width="140" height="36" rx="4" fill="#48a87b"/>
  <text x="765" y="538" fill="#0f1412" font-size="13" font-weight="bold">Open Workspace</text>
  <text x="650" y="538" fill="#758b7b" font-size="13">Skip to Chat</text>
</svg>
