<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" style="background:#0f1412; font-family:sans-serif;">
  <rect width="960" height="600" fill="#0f1412"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="237" height="600" fill="#121815" stroke="#283832"/>
  <text x="20" y="35" fill="#e8efe9" font-size="16" font-weight="bold">Sanctum</text>
  
  <!-- Top Bar with Warning Pill -->
  <rect x="237" y="0" width="723" height="50" fill="#151c19" stroke="#283832"/>
  <text x="260" y="32" fill="#e8efe9" font-size="14" font-weight="bold">Local Session</text>
  
  <!-- Engine Down Status Pill -->
  <rect x="730" y="14" width="200" height="24" rx="12" fill="#2d1515" stroke="#f87171"/>
  <circle cx="745" cy="26" r="4" fill="#f87171"/>
  <text x="756" y="30" fill="#f87171" font-size="11" font-weight="bold">Engine Offline (Daemon restart)</text>

  <!-- Error Recovery Hero Card in Main Surface -->
  <rect x="300" y="120" width="600" height="280" rx="10" fill="#151c19" stroke="#b91c1c" stroke-width="1.5"/>
  
  <!-- Error Header -->
  <circle cx="340" cy="165" r="16" fill="#2d1515" stroke="#f87171"/>
  <text x="335" y="171" fill="#f87171" font-size="18" font-weight="bold">!</text>
  <text x="375" y="172" fill="#e8efe9" font-size="18" font-weight="bold">Inference Engine Temporarily Unavailable</text>

  <!-- Plain, Warm, Specific Copy (Microcopy standard) -->
  <text x="340" y="220" fill="#9fb3a4" font-size="13">What happened: The background model worker ran out of memory or restarted.</text>
  <text x="340" y="245" fill="#9fb3a4" font-size="13">Why: Peak VRAM allocation exceeded profile ceiling (ADR 0036 recovery triggered).</text>
  <text x="340" y="270" fill="#e8efe9" font-size="13">What you can do: Sanctum is automatically recovering (attempt 2 of 3).</text>
  <text x="340" y="295" fill="#e8efe9" font-size="13">Your message draft and conversation history are safely preserved.</text>

  <!-- Progress and Retry Button -->
  <rect x="340" y="325" width="220" height="8" rx="4" fill="#283832"/>
  <rect x="340" y="325" width="140" height="8" rx="4" fill="#fbbf24"/>
  <text x="340" y="355" fill="#fbbf24" font-size="12">Reconnecting in 3s...</text>

  <rect x="680" y="335" width="190" height="36" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="730" y="358" fill="#e8efe9" font-size="12" font-weight="bold">Retry Now</text>

  <!-- Composer Disabled State -->
  <rect x="255" y="520" width="680" height="60" rx="6" fill="#151c19" stroke="#283832" opacity="0.6"/>
  <text x="275" y="555" fill="#5a6d60" font-size="13">Composer disabled while engine reconnects...</text>
</svg>
