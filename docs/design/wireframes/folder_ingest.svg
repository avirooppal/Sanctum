<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" style="background:#0f1412; font-family:sans-serif;">
  <rect width="960" height="600" fill="#0f1412"/>
  
  <!-- Left Shell: Knowledge Browser -->
  <rect x="0" y="0" width="300" height="600" fill="#121815" stroke="#283832"/>
  <text x="25" y="35" fill="#e8efe9" font-size="16" font-weight="bold">Knowledge Library</text>
  <line x1="0" y1="50" x2="300" y2="50" stroke="#283832"/>
  
  <!-- Ingested folders list -->
  <text x="25" y="80" fill="#9fb3a4" font-size="11" font-weight="bold">INDEXED COLLECTIONS</text>
  
  <rect x="15" y="95" width="270" height="48" rx="6" fill="#1c2622" stroke="#283832"/>
  <text x="30" y="118" fill="#e8efe9" font-size="12" font-weight="bold">📁 Clinical_Guidelines_2026</text>
  <text x="30" y="134" fill="#9fb3a4" font-size="10">8 files • 142 chunks • sqlite-vec</text>

  <rect x="15" y="155" width="270" height="48" rx="6" fill="#151c19" stroke="#283832"/>
  <text x="30" y="178" fill="#e8efe9" font-size="12">📁 Patient_Protocols</text>
  <text x="30" y="194" fill="#9fb3a4" font-size="10">3 files • 56 chunks</text>

  <!-- Right Area: Dropzone & Ingest Progress -->
  <rect x="330" y="40" width="590" height="520" rx="8" fill="#151c19" stroke="#283832"/>
  <text x="360" y="80" fill="#e8efe9" font-size="18" font-weight="bold">Ingest Folder to Knowledge Base</text>
  <text x="360" y="105" fill="#9fb3a4" font-size="13">Parsed with offline pypdf/markdown parsers. Embedded into local vector DB.</text>

  <!-- Drop Area -->
  <rect x="360" y="130" width="530" height="150" rx="8" fill="#1c2622" stroke="#48a87b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="560" y="195" fill="#48a87b" font-size="28" text-anchor="middle">📂</text>
  <text x="560" y="225" fill="#e8efe9" font-size="14" font-weight="bold" text-anchor="middle">Drop folder here or click to browse</text>
  <text x="560" y="245" fill="#9fb3a4" font-size="12" text-anchor="middle">Supports .pdf, .md, .txt (Max 10 MB per file)</text>

  <!-- Ingestion In-Progress Card -->
  <rect x="360" y="310" width="530" height="150" rx="8" fill="#1c2622" stroke="#283832"/>
  <text x="385" y="340" fill="#e8efe9" font-size="14" font-weight="bold">Ingesting: "Research_Notes_Q3"</text>
  <text x="385" y="365" fill="#9fb3a4" font-size="12">Processing: phase3_trials_update.pdf (Section 4/12)</text>
  
  <!-- Determinate Progress Bar -->
  <rect x="385" y="380" width="480" height="10" rx="5" fill="#283832"/>
  <rect x="385" y="380" width="288" height="10" rx="5" fill="#34d399"/>
  <text x="385" y="410" fill="#34d399" font-size="12" font-weight="bold">60% Complete (36 of 60 chunks indexed)</text>
  
  <!-- Cancel Button -->
  <rect x="765" y="420" width="100" height="30" rx="4" fill="#281c1c" stroke="#f87171"/>
  <text x="815" y="440" fill="#f87171" font-size="12" text-anchor="middle">Cancel</text>

  <!-- Privacy guarantee banner -->
  <rect x="360" y="480" width="530" height="50" rx="6" fill="#121815" stroke="#283832"/>
  <text x="380" y="510" fill="#34d399" font-size="12">🔒 Zero cloud indexing: Vectors remain in ~/.sanctum/knowledge.db on 127.0.0.1</text>
</svg>
