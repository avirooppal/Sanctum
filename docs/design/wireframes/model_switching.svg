<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" style="background:#0f1412; font-family:sans-serif;">
  <rect width="960" height="600" fill="#0f1412"/>
  
  <!-- Backdrop Workspace -->
  <rect x="0" y="0" width="237" height="600" fill="#121815" opacity="0.6"/>
  <rect x="237" y="0" width="723" height="600" fill="#0f1412" opacity="0.6"/>

  <!-- Model Picker Modal Dialog -->
  <rect x="220" y="60" width="520" height="480" rx="10" fill="#151c19" stroke="#283832" stroke-width="1.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
  
  <!-- Modal Header -->
  <text x="250" y="100" fill="#e8efe9" font-size="18" font-weight="bold">Select Local Model</text>
  <text x="250" y="125" fill="#9fb3a4" font-size="13">Switch models without losing current conversation context.</text>
  <line x1="220" y1="145" x2="740" y2="145" stroke="#283832"/>

  <!-- Active Model Option -->
  <rect x="245" y="165" width="470" height="85" rx="6" fill="#1c2622" stroke="#48a87b" stroke-width="2"/>
  <text x="265" y="195" fill="#e8efe9" font-size="14" font-weight="bold">Qwen 2.5 7B Instruct</text>
  <rect x="630" y="178" width="70" height="22" rx="4" fill="#23583f"/>
  <text x="642" y="193" fill="#ffffff" font-size="11" font-weight="bold">ACTIVE</text>
  <text x="265" y="220" fill="#9fb3a4" font-size="12">Quant: Q4_K_M • RAM: 4.8 GB • Context: 8k • Tokens/s: ~26.4</text>
  <text x="265" y="238" fill="#34d399" font-size="11">✓ Verified on current hardware profile</text>

  <!-- Second Model Option -->
  <rect x="245" y="265" width="470" height="85" rx="6" fill="#151c19" stroke="#283832"/>
  <text x="265" y="295" fill="#e8efe9" font-size="14" font-weight="bold">Llama 3.2 3B Instruct</text>
  <rect x="630" y="278" width="70" height="22" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="645" y="293" fill="#9fb3a4" font-size="11">FAST</text>
  <text x="265" y="320" fill="#9fb3a4" font-size="12">Quant: Q8_0 • RAM: 3.2 GB • Context: 8k • Tokens/s: ~48.1</text>
  <text x="265" y="338" fill="#9fb3a4" font-size="11">Fast response, optimized for quick summaries</text>

  <!-- Third Model Option -->
  <rect x="245" y="365" width="470" height="85" rx="6" fill="#151c19" stroke="#283832"/>
  <text x="265" y="395" fill="#e8efe9" font-size="14" font-weight="bold">Mistral Nemo 12B</text>
  <rect x="620" y="378" width="80" height="22" rx="4" fill="#1c2622" stroke="#fbbf24"/>
  <text x="632" y="393" fill="#fbbf24" font-size="11">HIGH VRAM</text>
  <text x="265" y="420" fill="#9fb3a4" font-size="12">Quant: Q4_K_M • RAM: 8.9 GB • Context: 16k • Tokens/s: ~16.2</text>
  <text x="265" y="438" fill="#fbbf24" font-size="11">Heavy profile - May cause swap on &lt;16GB systems</text>

  <!-- Footer Actions -->
  <line x1="220" y1="470" x2="740" y2="470" stroke="#283832"/>
  <rect x="620" y="485" width="95" height="36" rx="4" fill="#48a87b"/>
  <text x="645" y="508" fill="#0f1412" font-size="13" font-weight="bold">Switch</text>
  <rect x="525" y="485" width="80" height="36" rx="4" fill="#1c2622" stroke="#283832"/>
  <text x="545" y="508" fill="#e8efe9" font-size="13">Cancel</text>
</svg>
